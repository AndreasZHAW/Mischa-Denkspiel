<!DOCTYPE html>
<html lang="de"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Mischa Zoo 3D</title>

<style>html,body{margin:0;height:100%;background:#000;overflow:hidden}</style>

<!-- v878: Kino-Intro (Erde, Logo, Flammen + Lied). Erstes Öffnen auf diesem Gerät: ganze Szene (~18 s). Danach: 4-Sekunden-Kurzfassung. -->
<script src="zambience.js?v=878"></script>
<script>
(function(){
  var go=function(){ try{ localStorage.setItem('mischa_intro_seen','1'); sessionStorage.setItem('mischa_intro_done','1'); }catch(e){} window.location.replace('index.html?from_intro=1'); };
  var seen=false; try{ seen=!!localStorage.getItem('mischa_intro_seen'); }catch(e){}
  var tries=0;
  (function start(){
    if(window.ZAmb&&ZAmb.playIntro){ try{ ZAmb.playIntro({short:seen,onDone:go}); }catch(e){ go(); } return; }
    if(++tries>40) return go(); setTimeout(start,50);
  })();
  setTimeout(go,seen?15000:40000); /* Sicherheitsnetz */
})();
</script>
</body></html>
