<!DOCTYPE html>
<html lang="de">
<head>
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vorschau — Janosch-Space-Ship v4</title>
<style>
  html,body{margin:0;height:100%;background:#000;overflow:hidden;font-family:'Trebuchet MS',Arial,sans-serif}
  #cv{position:absolute;inset:0;width:100%;height:100%}
  #ui{position:absolute;inset:0;pointer-events:none;z-index:3;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:7%}
  .speech{max-width:80%;background:linear-gradient(135deg,rgba(8,16,40,.94),rgba(2,6,20,.94));
    border:2px solid #4af0ff;border-radius:14px;padding:13px 22px;color:#fff;text-align:center;
    box-shadow:0 0 30px rgba(74,240,255,.45),0 8px 30px rgba(0,0,0,.7);opacity:0;transition:opacity .35s}
  .speech .who{font-size:.78rem;letter-spacing:2px;color:#4af0ff;font-weight:800;text-transform:uppercase;margin-bottom:3px}
  .speech .msg{font-size:clamp(1rem,3.5vw,1.4rem);font-weight:700;line-height:1.3}
  #title{position:absolute;top:9%;left:0;right:0;text-align:center;z-index:3;pointer-events:none;
    font-weight:900;letter-spacing:3px;opacity:0;transition:opacity .6s;font-family:'Arial Black',Impact,sans-serif}
  #title .welcome{display:block;font-size:clamp(.8rem,3vw,1.3rem);color:#ffe24a;letter-spacing:5px;text-shadow:0 0 18px rgba(255,210,74,.6);margin-bottom:4px}
  #title .ship{display:block;font-size:clamp(1.5rem,7vw,3.4rem);
    background:linear-gradient(90deg,#4af0ff,#9fd8ff,#4af0ff);-webkit-background-clip:text;background-clip:text;
    -webkit-text-fill-color:transparent;text-shadow:0 0 50px rgba(74,240,255,.5)}
  #replay{position:fixed;bottom:14px;right:14px;z-index:10;background:#4af0ff;color:#021018;border:none;
    padding:12px 20px;border-radius:10px;font-weight:800;font-size:1rem;cursor:pointer;box-shadow:0 4px 14px rgba(0,0,0,.5)}
  #note{position:fixed;top:10px;left:10px;z-index:10;color:#8af;font-size:.72rem;background:rgba(0,0,0,.5);padding:6px 10px;border-radius:8px;max-width:62%}
</style>
</head>
<body>
  <canvas id="cv"></canvas>
  <audio id="introMusic" src="mischa_intro.mp3" preload="auto"></audio>
  <div id="title"><span class="welcome">WELCOME TO THE</span><span class="ship">JANOSCH-SPACE-SHIP</span></div>
  <div id="ui"><div class="speech" id="speech"><div class="who" id="who">Janosch</div><div class="msg" id="msg"></div></div></div>
  <div id="note">Vorschau v4: ECHTE Anfangsmusik (mp3) · gesprochenes „Janosch Space Ship" · kein Knacken mehr.</div>
  <button id="replay" onclick="run()">▶ Abspielen (mit Ton + Stimme)</button>

<script>
const PLAYER_NAME='Opa', PLAYER_EMOJI='👴';
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
let W,H,animId,frame;
function resize(){W=cv.width=innerWidth;H=cv.height=innerHeight;}
addEventListener('resize',resize);resize();
const speechEl=document.getElementById('speech'),whoEl=document.getElementById('who'),msgEl=document.getElementById('msg'),titleEl=document.getElementById('title');
const introMusic=document.getElementById('introMusic');
let stars=[];function initStars(){stars=Array.from({length:160},()=>({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.6+0.3,tw:Math.random()*7}));}

// ===== REAL INTRO MUSIC = the mp3 file (slightly changed: start a touch in + gentle fade-in) =====
function playMusic(){
  try{
    introMusic.pause();introMusic.currentTime=0.0;
    introMusic.volume=0;
    introMusic.play().then(()=>{
      // gentle fade-in so it feels "slightly different" / softer entrance
      let v=0;const fade=setInterval(()=>{v=Math.min(0.75,v+0.05);introMusic.volume=v;if(v>=0.75)clearInterval(fade);},60);
    }).catch(()=>{});
  }catch(e){}
}
function stopMusic(){try{introMusic.pause();}catch(e){}}

// ===== SPOKEN TEXT (louder, retried until voices ready) =====
function speak(text){
  try{
    if(!('speechSynthesis' in window))return;
    const go=()=>{
      const u=new SpeechSynthesisUtterance(text);
      u.lang='en-US';u.rate=.92;u.pitch=1.05;u.volume=1;
      const vs=speechSynthesis.getVoices();
      const en=vs.find(v=>/^en[-_]/i.test(v.lang))||vs.find(v=>/en/i.test(v.lang));
      if(en)u.voice=en;
      speechSynthesis.speak(u);
    };
    if(speechSynthesis.getVoices().length===0){
      speechSynthesis.onvoiceschanged=()=>{speechSynthesis.onvoiceschanged=null;go();};
      // also try after a short delay in case event doesn't fire
      setTimeout(go,250);
    } else go();
  }catch(e){}
}

function drawShip(cx,cy,s,doorOpen,glow){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const eg=ctx.createRadialGradient(-92,0,0,-92,0,70);
  eg.addColorStop(0,`rgba(120,200,255,${0.85*glow})`);eg.addColorStop(.5,`rgba(60,120,255,${0.4*glow})`);eg.addColorStop(1,'rgba(0,0,80,0)');
  ctx.fillStyle=eg;ctx.beginPath();ctx.arc(-92,0,70,0,7);ctx.fill();
  ctx.fillStyle='#1b2230';ctx.fillRect(-95,-22,22,16);ctx.fillRect(-95,6,22,16);
  ctx.fillStyle=`rgba(150,230,255,${0.6+0.4*glow})`;ctx.fillRect(-97,-20,6,12);ctx.fillRect(-97,8,6,12);
  const hull=ctx.createLinearGradient(0,-46,0,46);hull.addColorStop(0,'#d8e2f2');hull.addColorStop(.5,'#9aa6c0');hull.addColorStop(1,'#5a647e');
  ctx.fillStyle=hull;ctx.beginPath();ctx.moveTo(120,0);ctx.lineTo(20,-26);ctx.lineTo(-75,-22);ctx.lineTo(-88,-10);ctx.lineTo(-88,10);ctx.lineTo(-75,22);ctx.lineTo(20,26);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(40,50,80,.6)';ctx.lineWidth=1.5;ctx.beginPath();ctx.moveTo(20,-26);ctx.lineTo(20,26);ctx.moveTo(-30,-24);ctx.lineTo(-30,24);ctx.moveTo(70,-13);ctx.lineTo(70,13);ctx.stroke();
  ctx.fillStyle='#6a7596';ctx.beginPath();ctx.moveTo(-10,-24);ctx.lineTo(-30,-58);ctx.lineTo(-46,-56);ctx.lineTo(-40,-22);ctx.closePath();ctx.fill();
  ctx.fillStyle='#7d88a8';ctx.beginPath();ctx.moveTo(-20,-18);ctx.lineTo(-70,-62);ctx.lineTo(-58,-60);ctx.lineTo(-8,-20);ctx.closePath();ctx.fill();
  ctx.beginPath();ctx.moveTo(-20,18);ctx.lineTo(-70,62);ctx.lineTo(-58,60);ctx.lineTo(-8,20);ctx.closePath();ctx.fill();
  ctx.fillStyle='#c0392b';ctx.fillRect(-73,-64,7,5);ctx.fillRect(-73,60,7,5);
  const cg=ctx.createLinearGradient(40,-20,70,5);cg.addColorStop(0,'rgba(190,235,255,.95)');cg.addColorStop(.6,'rgba(70,150,255,.75)');cg.addColorStop(1,'rgba(15,45,110,.55)');
  ctx.fillStyle=cg;ctx.beginPath();ctx.moveTo(44,-14);ctx.lineTo(78,-6);ctx.lineTo(78,6);ctx.lineTo(44,14);ctx.closePath();ctx.fill();
  ctx.strokeStyle='rgba(160,210,255,.9)';ctx.lineWidth=2;ctx.stroke();
  ctx.fillStyle='#e8533a';ctx.fillRect(-20,-4,90,4);ctx.fillStyle='#ffb24a';ctx.fillRect(-20,2,90,2);
  ctx.save();ctx.fillStyle='#161b28';ctx.fillRect(-46,16,34,10);
  if(doorOpen>0){ctx.fillStyle='#7d88aa';ctx.save();ctx.translate(-46,26);ctx.rotate(doorOpen*0.6);ctx.fillRect(0,0,34,5);ctx.restore();ctx.fillStyle=`rgba(255,220,140,${0.7*doorOpen})`;ctx.fillRect(-44,16,30*doorOpen,9);}
  ctx.restore();
  ctx.fillStyle='rgba(0,0,0,.4)';ctx.fillRect(-8,-2,70,15);ctx.fillStyle='#4af0ff';ctx.font='bold 9px Trebuchet MS';ctx.textAlign='center';ctx.fillText('JANOSCH-SPACE-SHIP',27,9);
  ctx.fillStyle=`rgba(0,255,180,${0.4+Math.sin(frame*0.2)*0.5})`;ctx.beginPath();ctx.arc(100,0,3,0,7);ctx.fill();
  ctx.fillStyle=`rgba(255,90,0,${0.4+Math.sin(frame*0.2+3)*0.5})`;ctx.beginPath();ctx.arc(-40,0,3,0,7);ctx.fill();
  ctx.restore();
}
function drawJanosch(cx,cy,s,wave){
  ctx.save();ctx.translate(cx,cy);ctx.scale(s,s);
  const hg=ctx.createRadialGradient(0,44,2,0,44,46);hg.addColorStop(0,'rgba(74,240,255,.35)');hg.addColorStop(1,'rgba(74,240,255,0)');
  ctx.fillStyle=hg;ctx.beginPath();ctx.ellipse(0,46,32,9,0,0,7);ctx.fill();
  ctx.fillStyle='#d8dde8';ctx.beginPath();ctx.roundRect(-14,38,12,12,3);ctx.fill();ctx.beginPath();ctx.roundRect(3,38,12,12,3);ctx.fill();
  ctx.fillStyle='#e8edf6';ctx.beginPath();ctx.roundRect(-13,16,11,26,5);ctx.fill();ctx.beginPath();ctx.roundRect(3,16,11,26,5);ctx.fill();
  ctx.fillStyle='#4af0ff';ctx.fillRect(-12,28,9,3);ctx.fillRect(4,28,9,3);
  const body=ctx.createLinearGradient(-20,-12,20,26);body.addColorStop(0,'#ffffff');body.addColorStop(1,'#c6cfe0');
  ctx.fillStyle=body;ctx.beginPath();ctx.roundRect(-20,-14,40,34,12);ctx.fill();
  ctx.fillStyle='#1b2230';ctx.beginPath();ctx.roundRect(-11,-6,22,14,3);ctx.fill();
  ctx.fillStyle='#27e070';ctx.fillRect(-8,-3,4,3);ctx.fillStyle='#ffb24a';ctx.fillRect(-2,-3,4,3);ctx.fillStyle='#e8533a';ctx.fillRect(4,-3,4,3);ctx.fillStyle='#4af0ff';ctx.fillRect(-8,3,16,2);
  ctx.fillStyle='#aab4c8';ctx.beginPath();ctx.roundRect(-24,-12,8,16,4);ctx.fill();ctx.beginPath();ctx.roundRect(16,-12,8,16,4);ctx.fill();
  const wa=Math.sin(wave*6)*0.5;
  ctx.strokeStyle='#e8edf6';ctx.lineWidth=9;ctx.lineCap='round';
  ctx.beginPath();ctx.moveTo(16,-6);ctx.lineTo(28+wa*5,-26-wa*7);ctx.stroke();
  ctx.beginPath();ctx.moveTo(-16,-6);ctx.lineTo(-26,10);ctx.stroke();
  ctx.fillStyle='#4af0ff';ctx.beginPath();ctx.arc(28+wa*5,-28-wa*7,5,0,7);ctx.fill();ctx.beginPath();ctx.arc(-26,12,5,0,7);ctx.fill();
  ctx.fillStyle='#eef2fa';ctx.beginPath();ctx.arc(0,-30,17,0,7);ctx.fill();
  const vg=ctx.createLinearGradient(-12,-38,12,-22);vg.addColorStop(0,'#0a2a4a');vg.addColorStop(.4,'#1d6fff');vg.addColorStop(.55,'#5fd0ff');vg.addColorStop(1,'#0a2a4a');
  ctx.fillStyle=vg;ctx.beginPath();ctx.ellipse(0,-30,12,11,0,0,7);ctx.fill();
  ctx.fillStyle='rgba(255,255,255,.7)';ctx.beginPath();ctx.ellipse(-5,-34,3,5,-0.5,0,7);ctx.fill();
  ctx.strokeStyle='#aab4c8';ctx.lineWidth=2.5;ctx.beginPath();ctx.arc(0,-30,17,0,7);ctx.stroke();
  ctx.strokeStyle='#4af0ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(13,-40);ctx.lineTo(20,-50);ctx.stroke();
  ctx.fillStyle='#e8533a';ctx.beginPath();ctx.arc(20,-51,3,0,7);ctx.fill();
  ctx.globalAlpha=0.08;ctx.fillStyle='#4af0ff';for(let y=-48;y<50;y+=4)ctx.fillRect(-26,y,52,1);ctx.globalAlpha=1;
  ctx.fillStyle='#4af0ff';ctx.font='bold 10px Trebuchet MS';ctx.textAlign='center';ctx.fillText('🚀 JANOSCH',0,62);
  ctx.restore();
}
function drawPlayer(x,y,s,bob){ctx.save();ctx.translate(x,y+Math.sin(bob)*3);ctx.scale(s,s);ctx.fillStyle='rgba(0,0,0,.35)';ctx.beginPath();ctx.ellipse(0,30,20,6,0,0,7);ctx.fill();ctx.font='44px serif';ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillText(PLAYER_EMOJI,0,0);ctx.fillStyle='#fff';ctx.font='bold 13px Trebuchet MS';ctx.fillText(PLAYER_NAME,0,34);ctx.restore();}
function setSpeech(who,msg,show){whoEl.textContent=who;msgEl.textContent=msg;speechEl.style.opacity=show?'1':'0';}

const TOTAL=210;let _spoke={};
function loop(){
  const f=frame;ctx.clearRect(0,0,W,H);
  const bg=ctx.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#03040c');bg.addColorStop(.6,'#080c1e');bg.addColorStop(1,'#0e1228');ctx.fillStyle=bg;ctx.fillRect(0,0,W,H);
  stars.forEach(st=>{const a=0.4+Math.sin(f*0.05+st.tw)*0.4;ctx.globalAlpha=a;ctx.fillStyle='#cfe5ff';ctx.beginPath();ctx.arc(st.x,st.y,st.r,0,7);ctx.fill();});ctx.globalAlpha=1;
  const floorY=H*0.72;ctx.strokeStyle='rgba(80,140,255,.22)';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(0,floorY);ctx.lineTo(W,floorY);ctx.stroke();
  const fgr=ctx.createLinearGradient(0,floorY,0,H);fgr.addColorStop(0,'rgba(40,70,160,.22)');fgr.addColorStop(1,'rgba(10,15,40,0)');ctx.fillStyle=fgr;ctx.fillRect(0,floorY,W,H-floorY);
  titleEl.style.opacity=(f>8&&f<170)?'1':'0';
  const shipS=Math.min(W,H)/560*1.2,shipX=W*0.64,shipY=floorY-40;
  const janoschS=Math.min(W,H)/560*0.85,janoschX=W*0.64-150*shipS,janoschY=floorY-4;
  const doorOpen=f<105?0:Math.min(1,(f-105)/25);
  const doorClose=f>185?Math.min(1,(f-185)/18):0;
  const finalDoor=Math.max(0,doorOpen-doorClose);
  const powerGlow=f>185?Math.min(1,(f-185)/18):(f>20?0.5:0);
  drawShip(shipX,shipY,shipS,finalDoor,powerGlow);
  if(f>10)drawJanosch(janoschX,janoschY,janoschS,f*0.04);
  const rampX=shipX-46*shipS;
  if(f<150){const t=Math.min(1,Math.max(0,(f-40)/70));const px=W*0.10+(rampX-W*0.10)*t;const walking=f>40&&f<105;if(f<170)drawPlayer(px,floorY-4,Math.min(W,H)/560*1.05,walking?f*0.3:0);}
  else if(f<170){const t=(f-150)/20;ctx.globalAlpha=1-t;drawPlayer(rampX,floorY-4,(Math.min(W,H)/560*1.05)*(1-t*0.6),0);ctx.globalAlpha=1;}
  if(f>=8&&!_spoke.welcome){_spoke.welcome=1;speak('Welcome to the Janosch Space Ship');}
  if(f>=14&&f<46){setSpeech('🚀 Janosch','Welcome to the Janosch-Space-Ship!',true);}
  else if(f>=52&&f<102){setSpeech('🚀 Janosch','Steig ein, '+PLAYER_NAME+'!',true);}
  else if(f>=108&&f<170){setSpeech('🚀 Janosch','Festschnallen — wir fliegen zum Zoo!',true);}
  else if(f>=170){setSpeech('🚀 Janosch','Triebwerke an… 3… 2… 1…',f<200);}
  else{setSpeech('','',false);}
  // soft visual flash only (NO crackling audio whoosh anymore)
  if(f>195){ctx.fillStyle=`rgba(120,200,255,${(f-195)/12*0.6})`;ctx.fillRect(0,0,W,H);}
  frame++;
  if(frame<=TOTAL){animId=requestAnimationFrame(loop);}
  else{setSpeech('','',false);titleEl.style.opacity='0';ctx.fillStyle='rgba(0,0,0,.6)';ctx.fillRect(0,0,W,H);ctx.fillStyle='#4af0ff';ctx.font='bold 20px Trebuchet MS';ctx.textAlign='center';ctx.fillText('→ (danach kommt der bestehende Weltraumflug)',W/2,H/2);}
}
function run(){if(animId)cancelAnimationFrame(animId);resize();initStars();frame=0;_spoke={};titleEl.style.opacity='0';setSpeech('','',false);if('speechSynthesis'in window)speechSynthesis.getVoices();playMusic();loop();}
run();
</script>
</body>
</html>
