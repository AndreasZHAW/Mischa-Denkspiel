  <style>
    /* ══ RESPONSIVE FONT SYSTEM ══
       Approach: Dynamic root font-size via JS (see below) + clamp() everywhere.
       On Android: screen.width gives physical pixels / DPR = CSS pixels.
       We scale root 14px→18px based on viewport width.
       All rem-based sizes auto-scale. Touch targets min 48px (Material Design).
    */
    :root {
      --user-font-size: 16px;  /* THE single source of truth — set by FontScale.apply() */
      --user-font-scale: 1.0;
      --fs-xs:  calc(var(--user-font-size) * 0.80);
      --fs-sm:  calc(var(--user-font-size) * 0.90);
      --fs-md:  var(--user-font-size);
      --fs-lg:  calc(var(--user-font-size) * 1.10);
      --fs-xl:  calc(var(--user-font-size) * 1.22);
      --fs-2xl: calc(var(--user-font-size) * 1.45);
      --touch-min: 44px;
    }
    /* CLEAN FONT SYSTEM: html font-size = user setting, so ALL rem units scale together.
       No vw, no media queries, no competing rules. One source of truth. */
    html { font-size: var(--user-font-size) !important; -webkit-text-size-adjust: 100% !important; text-size-adjust: 100% !important; }
    body { font-size: 1rem; }
    button { min-height: var(--touch-min); font-size: 1rem !important; }
    input, select, textarea { font-size: 1rem !important; min-height: var(--touch-min); }
    /* World map cards */
    .card { font-size: var(--fs-md); }
    /* HUD elements */
    .wbtitle { font-size: var(--fs-sm) !important; }

  <script>
  // PHASE 1 FIX v267: Block Android's long-press context menu (Download/Share/Print).
  // -webkit-touch-callout (CSS) only affects iOS Safari — it does NOT stop Android
  // Chrome's native long-press menu on canvas/img. The real fix is intercepting the
  // 'contextmenu' event itself, which Android fires on long-press.
  document.addEventListener('contextmenu', function(e) {
    if (e.target.closest && e.target.closest('canvas, #game-area, .game-control, [class*="ctrl"], [class*="control"]')) {
      e.preventDefault();
      return false;
    }
  }, false);
  // Prevent double-tap zoom globally
  let lastTap = 0;
  document.addEventListener('touchend', function(e) {
    const now = Date.now();
    if (now - lastTap < 300) {
      e.preventDefault();
    }
    lastTap = now;
  }, {passive: false});
  // Prevent pinch zoom
  document.addEventListener('touchmove', function(e) {
    if (e.touches.length > 1) e.preventDefault();
  }, {passive: false});
  </script>

<script>
// ══ RESPONSIVE FONT SCALER ══
// Strategy: Calculate optimal root font-size based on device viewport and DPR.
// Problem: On Android (DPR=2-3), fixed px sizes appear tiny because
// CSS pixels are smaller than physical pixels. 
// Solution: Set root font-size to scale with viewport width.
(function(){
  var vw = window.innerWidth || document.documentElement.clientWidth;
  var dpr = window.devicePixelRatio || 1;
  var base;
  if(vw < 340) base = 17;
  else if(vw < 380) base = 16;
  else if(vw < 420) base = 15.5;
  else if(vw < 500) base = 15;
  else base = 15;
  document.documentElement.style.fontSize = base + 'px';
  window._mobileFontBase = base;
  window._isMobileDevice = dpr >= 1.5 || vw <= 600;
  
  // Check if player has a saved font size (applied before FontScale object loads)
  // This prevents flash of wrong font size on load
  try {
    var deviceKey = screen.width+'x'+screen.height+'x'+(dpr).toFixed(1);
    // Try to find any saved font for current device
    var keys = Object.keys(localStorage);
    for(var i=0; i<keys.length; i++) {
      if(keys[i].indexOf('mischa_fontscale_') === 0 && keys[i].indexOf(deviceKey) > 0) {
        var saved = parseInt(localStorage.getItem(keys[i]));
        if(saved >= 10 && saved <= 22) {
          document.documentElement.style.fontSize = saved + 'px';
          // Also set body early
          document.addEventListener('DOMContentLoaded', function() {
            document.body.style.fontSize = saved + 'px';
          });
          break;
        }
      }
    }
  } catch(e) {}
})();
</script>

<script>
(function(){
  // FIRST: Restore session from localStorage backup if sessionStorage lost it
  if (!sessionStorage.getItem('mischa_current')) {
    const backup = localStorage.getItem('mischa_current_backup');
    if (backup) sessionStorage.setItem('mischa_current', backup);
  }
  // Check both localStorage AND sessionStorage AND URL param
  const key = 'mischa_intro_ts';
  const urlParam = new URLSearchParams(window.location.search).get('from_intro');
  if(urlParam === '1'){
    // Came directly from intro → skip, set timestamp
    localStorage.setItem(key, Date.now().toString());
    sessionStorage.setItem(key, Date.now().toString());
    // Clean URL
    window.history.replaceState({}, '', 'index.html');
    return;
  }
  const tsL = parseInt(localStorage.getItem(key) || '0');
  const tsS = parseInt(sessionStorage.getItem(key) || '0');
  const ts = Math.max(tsL, tsS);
  const now = Date.now();
  const TEN_MIN = 10 * 60 * 1000;
  if(now - ts < TEN_MIN){
    return; // Recently saw intro → skip
  }
  window.location.replace('intro.html');
})();
</script>

  <script>
    // Prevent double-tap zoom on touch devices
    let _lastTouch = 0;
    document.addEventListener('touchend', e => {
      const now = Date.now();
      if (now - _lastTouch < 300) { e.preventDefault(); }
      _lastTouch = now;
    }, { passive: false });

    async function checkMaintenance() {
      // Returns true if game is locked for maintenance
      try {
        await window._firebaseLoadPromise;
        if(typeof initFirebase==='function') initFirebase();
        if(typeof firebase==='undefined' || !firebase.apps || !firebase.apps.length) return false;
        const db = firebase.firestore();
        const doc = await Promise.race([
          db.collection('config').doc('maintenance').get(),
          new Promise((_,rej)=>setTimeout(()=>rej('timeout'),2500))
        ]);
        if(doc && doc.exists) {
          const d = doc.data();
          if(d.active && d.until > Date.now()) {
            showMaintenanceScreen(d.msg, d.until);
            return true;
          }
        }
      } catch(e) { /* on error, let them play */ }
      return false;
    }

    function showMaintenanceScreen(msg, until) {
      let liveUntil = until;
      let checking = false;

      document.body.innerHTML = `
        <div style="position:fixed;inset:0;background:linear-gradient(135deg,#1a1a2e,#16213e);
          display:flex;flex-direction:column;align-items:center;justify-content:center;
          color:#fff;font-family:Arial,sans-serif;text-align:center;padding:20px;z-index:99999">
          <div style="font-size:4rem;margin-bottom:16px;animation:spin 2s linear infinite">🔧</div>
          <h1 style="color:#FFD700;font-size:1.6rem;margin-bottom:12px">Wartungsmodus</h1>
          <p id="maint-msg" style="font-size:1.1rem;max-width:400px;line-height:1.5;margin-bottom:20px;color:rgba(255,255,255,.85)">${msg||'Ein Update wird eingespielt.'}</p>
          <div style="background:rgba(255,215,0,.15);border:2px solid #FFD700;border-radius:16px;padding:14px 28px">
            <div style="font-size:.85rem;color:rgba(255,255,255,.6);margin-bottom:4px">Noch ungefähr</div>
            <div id="maint-countdown" style="font-size:2.2rem;font-weight:900;color:#FFD700">--:--</div>
          </div>
          <button id="maint-refresh" style="margin-top:22px;background:linear-gradient(135deg,#FFD700,#F39C12);
            color:#1a1a2e;border:none;padding:13px 30px;border-radius:12px;font-size:1rem;font-weight:900;
            cursor:pointer;box-shadow:0 4px 16px rgba(255,215,0,.3)">🔄 Jetzt aktualisieren</button>
          <p style="font-size:.8rem;color:rgba(255,255,255,.4);margin-top:16px">Das Spiel aktualisiert sich automatisch, sobald die Wartung vorbei ist — du musst nichts tun.</p>
          <p id="maint-checkinfo" style="font-size:.72rem;color:rgba(255,255,255,.25);margin-top:6px">Prüfe Status…</p>
        </div>
        <style>@keyframes spin{from{transform:rotate(0)}to{transform:rotate(360deg)}}</style>`;

      const updateCountdown = () => {
        const left = Math.max(0, liveUntil - Date.now());
        const mins = Math.floor(left/60000), secs = Math.floor((left%60000)/1000);
        const cdEl = document.getElementById('maint-countdown');
        if(cdEl) cdEl.textContent = mins+':'+String(secs).padStart(2,'0');
      };

      // Poll Firebase live so we recover the moment the admin ends maintenance
      // (no manual reload needed — the whole point of this feature)
      const recover = () => { location.reload(); };
      const poll = async () => {
        if(checking) return; checking = true;
        const info = document.getElementById('maint-checkinfo');
        try {
          if(typeof firebase!=='undefined' && firebase.apps && firebase.apps.length) {
            const db = firebase.firestore();
            const doc = await db.collection('config').doc('maintenance').get();
            const d = doc.exists ? doc.data() : null;
            if(!d || !d.active || d.until <= Date.now()) {
              if(info) info.textContent = '✅ Wartung beendet — lädt…';
              recover(); return;
            }
            // Update live values (admin may have changed time/message)
            liveUntil = d.until;
            const msgEl = document.getElementById('maint-msg');
            if(msgEl && d.msg) msgEl.textContent = d.msg;
            if(info) info.textContent = 'Zuletzt geprüft: '+new Date().toLocaleTimeString('de-CH');
          }
        } catch(e) { if(info) info.textContent = 'Prüfung fehlgeschlagen, versuche erneut…'; }
        checking = false;
      };

      document.getElementById('maint-refresh').onclick = () => {
        const info = document.getElementById('maint-checkinfo');
        if(info) info.textContent = 'Prüfe…';
        poll();
      };

      updateCountdown();
      setInterval(updateCountdown, 1000);
      setInterval(poll, 4000); // check live status every 4s
      poll(); // immediate first check
    }

    async function boot() {
      // Show version for debugging
      const vEl = document.getElementById('load-status');
      if(vEl) vEl.textContent = 'v268 wird geladen...';
      // STEP 0: Check maintenance mode FIRST
      if(await checkMaintenance()) return; // game locked, stop here
      // STEP 1: Show welcome immediately (never block on network)
      const ret = sessionStorage.getItem('mischa_current');
      
      // Check local storage first (instant, no network)
      if (ret && typeof State !== 'undefined') {
        try {
          const localPlayer = State._local && State._local.get(ret);
          if (localPlayer) {
            State.setCurrentPlayer(localPlayer);
            App.showWorldMap();
            // Then try to refresh from cloud in background
            window._firebaseLoadPromise.then(() => {
              try { initFirebase(); State.getPlayer(ret).then(p => { if(p) State.setCurrentPlayer(p); }).catch(()=>{}); } catch(e) {}
            }).catch(()=>{});
            return;
          }
        } catch(e) {}
      }
      
      // No local player - show welcome screen IMMEDIATELY
      App.showWelcome();
      
      // Connect Firebase in background (doesn't block UI)
      window._firebaseLoadPromise.then(() => {
        try { initFirebase(); } catch(e) {}
        // Setup listeners after Firebase loads
        try { State.listenBroadcast(data => {
          const seen = sessionStorage.getItem('mischa_bc_seen');
          if (seen === data.id) return;
          sessionStorage.setItem('mischa_bc_seen', data.id);
          if (data.type === 'survey') showSurvey(data);
          else showBroadcastBanner(data.text);
        }); } catch(e) {}
        try { State.listenDiscounts(() => {}); } catch(e) {}
        // If user had a session, check cloud
        if (ret) {
          State.getPlayer(ret).then(p => {
            if (p && document.getElementById('app')?.innerHTML?.includes('Willkommen')) {
              State.setCurrentPlayer(p); App.showWorldMap();
            }
          }).catch(() => {});
        }
      }).catch(() => {});
    }

    function showBroadcastBanner(text) {
      document.getElementById('bc-banner')?.remove();
      const b = document.createElement('div');
      b.id = 'bc-banner';
      b.style.cssText = `position:fixed;top:0;left:0;right:0;z-index:9999;
        color:white;padding:8px 16px;text-align:center;
        font-family:'Arial',cursive;font-size:0.95rem;
        text-shadow:0 1px 4px rgba(0,0,0,0.8);
        animation:slideDown 0.4s ease;pointer-events:auto`;
      b.innerHTML = `📢 <span style="font-size:0.88rem">${text}</span>
        <button onclick="document.getElementById('bc-banner').remove()"
          style="background:none;border:none;color:rgba(255,255,255,0.7);padding:2px 8px;
            cursor:pointer;margin-left:6px;font-size:0.82rem">✕</button>`;
      document.body.prepend(b);
      setTimeout(() => { b.style.transition='opacity 0.6s'; b.style.opacity='0'; setTimeout(()=>b.remove(),600); }, 5000);
    }

    function showSurvey(data) {
      document.getElementById('bc-survey')?.remove();
      const extra = data.extra || {};
      const surveyId = data.id;
      if (State.hasVoted(surveyId)) return;
      const s = document.createElement('div');
      s.id = 'bc-survey';
      s.style.cssText = `position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:9999;
        max-width:320px;width:90%;animation:popIn 0.4s ease`;
      // 20 second countdown
      let timeLeft = 20;
      s.innerHTML = `
        <div style="color:white;text-align:center;margin-bottom:10px">
          <div style="font-family:'Arial',cursive;font-size:1.1rem;text-shadow:0 1px 4px rgba(0,0,0,0.8)">
            📊 ${data.text}
          </div>
          <div id="survey-timer" style="font-size:0.8rem;opacity:0.7;margin-top:2px">⏱ ${timeLeft}s</div>
        </div>
        <div style="display:grid;grid-template-columns:1fr 1fr;gap:10px">
          <button onclick="SurveyUI.vote('${surveyId}','a',this)"
            style="padding:16px 8px;border-radius:14px;border:none;cursor:pointer;
              background:rgba(39,174,96,0.85);color:white;font-family:'Arial',cursive;
              font-size:0.95rem;backdrop-filter:blur(4px);text-shadow:0 1px 3px rgba(0,0,0,0.3)">
            ✅ ${extra.optA||'Ja'}
          </button>
          <button onclick="SurveyUI.vote('${surveyId}','b',this)"
            style="padding:16px 8px;border-radius:14px;border:none;cursor:pointer;
              background:rgba(231,76,60,0.85);color:white;font-family:'Arial',cursive;
              font-size:0.95rem;backdrop-filter:blur(4px);text-shadow:0 1px 3px rgba(0,0,0,0.3)">
            ❌ ${extra.optB||'Nein'}
          </button>
        </div>`;
      document.body.appendChild(s);
      const tick = setInterval(() => {
        timeLeft--;
        const el = document.getElementById('survey-timer');
        if (el) el.textContent = '⏱ ' + timeLeft + 's';
        if (timeLeft <= 0) { clearInterval(tick); s.remove(); }
      }, 1000);
    }

    const SurveyUI = {
      async vote(surveyId, choice, btn) {
        await State.voteSurvey(surveyId, choice);
        const s = document.getElementById('bc-survey');
        if (s) {
          s.innerHTML = `<div style="color:white;text-align:center;font-family:'Arial',cursive;
            font-size:1rem;text-shadow:0 1px 4px rgba(0,0,0,0.8)">
            ✅ Danke für deine Stimme!</div>`;
          setTimeout(() => s.remove(), 2000);
        }
      }
    };
    window.SurveyUI = SurveyUI;
    window.showBroadcastBanner = showBroadcastBanner;
    window.showSurvey = showSurvey;

    document.addEventListener('DOMContentLoaded', () => {
      const status = document.getElementById('load-status');
      const errBox = document.getElementById('error-box');
      const reloadBtn = document.getElementById('reload-btn');

      function showError(msg) {
        if (errBox) { errBox.style.display='block'; errBox.textContent='❌ Fehler: '+msg; }
        if (reloadBtn) reloadBtn.style.display='block';
        if (status) status.textContent='Fehler aufgetreten';
      }

      // Catch ALL global errors
      window.onerror = function(msg, src, line) {
        showError(msg + ' (' + (src||'').split('/').pop() + ':' + line + ')');
        return false;
      };
      window.onunhandledrejection = function(e) {
        showError('Promise: ' + (e.reason?.message || e.reason));
      };

      if (status) status.textContent = 'Skripte laden...';

      // Hard failsafe: 3 seconds max
      const failsafe = setTimeout(() => {
        if (document.getElementById('loading-screen')?.style.display !== 'none') {
          if (typeof App !== 'undefined') {
            try { App.showWelcome(); } 
            catch(e) { showError('showWelcome: ' + e.message); }
          } else {
            showError('App nicht geladen - bitte neu laden');
          }
        }
      }, 3000);

      boot()
        .then(() => clearTimeout(failsafe))
        .catch(e => { clearTimeout(failsafe); showError('Boot: ' + e.message); });
    });
  </script>
  <style>
    @keyframes slideDown { from{transform:translateY(-100%);opacity:0} to{transform:translateY(0);opacity:1} }
  </style>
<script>
function _showDenkspielNews(news){
  if(document.getElementById('news-modal-d')) return;
  const ov=document.createElement('div'); ov.id='news-modal-d';
  ov.style.cssText='position:fixed;inset:0;z-index:99989;background:rgba(0,0,0,.88);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif';
  const card=document.createElement('div');
  card.style.cssText='background:#0d1a0d;border:2px solid #27AE60;border-radius:20px;max-width:440px;width:100%;max-height:85vh;overflow:hidden;box-shadow:0 20px 60px rgba(39,174,96,.3);display:flex;flex-direction:column';
  const hdr=document.createElement('div'); hdr.style.cssText='background:linear-gradient(135deg,#1a4a1a,#27AE60);padding:14px 18px;display:flex;align-items:center;gap:10px;flex-shrink:0';
  const badge=document.createElement('div'); badge.style.cssText='background:#FFD700;color:#000;border-radius:8px;padding:3px 10px;font-size:.75rem;font-weight:900'; badge.textContent='📰 UPDATE';
  const htitle=document.createElement('div'); htitle.style.cssText='color:#fff;font-weight:900;font-size:1rem;flex:1'; htitle.textContent='Was ist neu?';
  const xb=document.createElement('button'); xb.textContent='✕'; xb.style.cssText='background:none;border:none;color:rgba(255,255,255,.7);font-size:1.2rem;cursor:pointer';
  xb.onclick=()=>{ov.remove();_newsMarkSeenD(news.id);};
  hdr.appendChild(badge); hdr.appendChild(htitle); hdr.appendChild(xb);
  card.appendChild(hdr);
  const scroll=document.createElement('div'); scroll.style.cssText='overflow-y:auto;flex:1;padding:18px;min-height:0;-webkit-overflow-scrolling:touch';
  const ttl=document.createElement('div'); ttl.style.cssText='font-size:1.2rem;font-weight:900;color:#fff;margin-bottom:10px'; ttl.textContent=news.title;
  const bdy=document.createElement('div'); bdy.style.cssText='font-size:.88rem;color:rgba(255,255,255,.75);white-space:pre-wrap;line-height:1.6'; bdy.textContent=news.body||'';
  scroll.appendChild(ttl); scroll.appendChild(bdy);
  card.appendChild(scroll);
  const footer=document.createElement('div'); footer.style.cssText='padding:14px 18px;flex-shrink:0;border-top:1px solid rgba(255,255,255,.08)';
  const okb=document.createElement('button'); okb.textContent='👍 Verstanden!'; okb.style.cssText='width:100%;background:linear-gradient(135deg,#27AE60,#1E8449);color:#fff;border:none;padding:14px;border-radius:12px;font-weight:900;font-size:1rem;cursor:pointer';
  okb.onclick=()=>{ov.remove();_newsMarkSeenD(news.id);};
  footer.appendChild(okb);
  card.appendChild(footer);
  ov.appendChild(card); document.body.appendChild(ov);
}
function _newsMarkSeenD(id){const s=JSON.parse(localStorage.getItem('zoo_news_seen')||'[]');if(!s.includes(id)){s.push(id);if(s.length>20)s.shift();}localStorage.setItem('zoo_news_seen',JSON.stringify(s));}
</script>
<script>
function _showDenkspielAnnouncement(ann){
  if(document.getElementById('ann-modal-d')) return;
  const eventTs=ann.eventTs?new Date(ann.eventTs):null;
  const fmtDate=eventTs?eventTs.toLocaleString('de-CH',{weekday:'short',day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'}):'';
  const esc=s=>(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  const ov=document.createElement('div'); ov.id='ann-modal-d';
  ov.style.cssText='position:fixed;inset:0;z-index:99990;background:rgba(0,0,0,.85);display:flex;align-items:center;justify-content:center;padding:20px;font-family:Arial,sans-serif';
  ov.innerHTML=
    '<div style="background:#0a0a0a;border-radius:20px;max-width:420px;width:100%;overflow:hidden;box-shadow:0 20px 60px rgba(0,0,0,.8)">'+
      '<div style="display:flex;align-items:center;justify-content:space-between;padding:16px 20px;border-bottom:1px solid rgba(255,255,255,.1)">'+
        '<button onclick="document.getElementById('ann-modal-d').remove()" style="background:none;border:none;color:rgba(255,255,255,.6);font-size:1.4rem;cursor:pointer;width:32px;height:32px;display:flex;align-items:center;justify-content:center;border-radius:50%">✕</button>'+
        '<span style="color:#fff;font-weight:700;font-size:1rem">Event beitreten</span>'+
        '<div style="width:32px"></div>'+
      '</div>'+
      (fmtDate?'<div style="padding:16px 20px 0"><div style="display:inline-block;background:#fff;color:#000;border-radius:20px;padding:6px 14px;font-size:.82rem;font-weight:700">'+fmtDate+'</div></div>':'')+
      '<div style="background:#000;margin:12px 20px;border-radius:12px;padding:30px 20px;text-align:center">'+
        '<div style="font-size:clamp(1.6rem,8vw,2.8rem);font-weight:900;color:#fff;text-transform:uppercase;line-height:1.1;letter-spacing:2px">'+esc(ann.title)+'</div>'+
        (ann.desc?'<div style="margin-top:10px;font-size:.85rem;color:rgba(255,255,255,.7)">'+esc(ann.desc)+'</div>':'')+
      '</div>'+
      '<div style="padding:0 20px 20px">'+
        '<div style="font-weight:700;font-size:1rem;color:#fff;margin-bottom:14px">'+esc(ann.title)+'</div>'+
        (ann.eventTs?'<button onclick="_annNotifyD(''+ann.id+'',''+esc(ann.title)+'','+ann.eventTs+')" style="width:100%;background:#3478f6;color:#fff;border:none;padding:16px;border-radius:12px;font-size:1rem;font-weight:700;cursor:pointer">Benachrichtigen</button>':'')+
        '<button onclick="document.getElementById('ann-modal-d').remove();_annMarkSeenD(''+ann.id+'')" style="width:100%;background:rgba(255,255,255,.08);color:rgba(255,255,255,.6);border:none;padding:12px;border-radius:12px;font-size:.9rem;cursor:pointer;margin-top:8px">Schliessen</button>'+
      '</div>'+
    '</div>';
  document.body.appendChild(ov);
}
function _annMarkSeenD(id){const s=JSON.parse(localStorage.getItem('zoo_ann_seen')||'[]');if(!s.includes(id)){s.push(id);if(s.length>10)s.shift();}localStorage.setItem('zoo_ann_seen',JSON.stringify(s));}
async function _annNotifyD(id,title,eventTs){
  _annMarkSeenD(id); document.getElementById('ann-modal-d')?.remove();
  if(!('Notification' in window)){showAlert('❌ Benachrichtigungen nicht unterstützt.');return;}
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){showAlert('❌ Nicht erlaubt.');return;}
  const delay=eventTs-5*60*1000-Date.now();
  if(delay<0){showAlert('⏰ Zu spät für Erinnerung!');return;}
  setTimeout(()=>{try{new Notification('🎮 '+title,{body:'In 5 Minuten: '+title});}catch(e){}},delay);
  showAlert('✅ Erinnerung gesetzt! Du wirst 5 Min vorher benachrichtigt.');
}
</script>
