<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Diagnose — Mischa Denkspiel</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{background:#0a0a0a;color:#0f0;font-family:'Courier New',monospace;padding:12px;font-size:.82rem}
h2{color:#FFD700;margin-bottom:10px;font-size:1.1rem}
.btn-row{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
button{background:#222;color:#fff;border:1px solid #555;padding:7px 12px;cursor:pointer;border-radius:4px;font-size:.78rem}
button:hover{background:#333}
button.danger{border-color:#f44;color:#f44}
button.ok{border-color:#0f0;color:#0f0}
#log{white-space:pre-wrap;line-height:1.7;font-size:.8rem}
.ok{color:#0f0}.err{color:#f44}.warn{color:#fa0}.info{color:#4af}.dim{color:#666}
.sep{color:#555;display:block;margin:4px 0}
</style>
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <script>
  let lastTap=0;
  document.addEventListener('touchend',function(e){const n=Date.now();if(n-lastTap<300)e.preventDefault();lastTap=n;},{passive:false});
  document.addEventListener('touchmove',function(e){if(e.touches.length>1)e.preventDefault();},{passive:false});
  </script>
</head>
<body>
<h2>🔬 Mischa Denkspiel — Erweiterte Diagnose</h2>
<div class="btn-row">
  <button onclick="runDiag()">🔄 Komplett-Check</button>
  <button class="ok" onclick="goToGame()">▶ Direkt zu Welt 1</button>
  <button onclick="repairState()">🔧 State reparieren</button>
  <button onclick="testWorld()">🧪 Welt 1 simulieren</button>
  <button onclick="testLogin()">👤 Login testen</button>
  <button class="danger" onclick="clearAll()">🗑️ ALLES löschen</button>
  <button onclick="showStorage()">💾 Storage anzeigen</button>
  <button onclick="forceLogin()">🔑 Session setzen</button>
</div>
<div id="log"></div>

<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<script src="worlds.js"></script>
<!-- Load Firebase SDK for real test -->
<script>
window._fbLoaded = false;
const _s1 = document.createElement('script');
_s1.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js';
_s1.onload = () => {
  const _s2 = document.createElement('script');
  _s2.src = 'https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js';
  _s2.onload = () => { window._fbLoaded = true; };
  document.head.appendChild(_s2);
};
document.head.appendChild(_s1);
</script>
<script src="firebase-state.js"></script>
<script>
const log = document.getElementById('log');
let _L = (msg,cls='')=>{ log.innerHTML+='<span class="'+(cls||'')+'">['
  +new Date().toLocaleTimeString()+'] '+msg+'</span>\n'; log.scrollTop=log.scrollHeight;};
const L=(m,c)=>_L(m,c);
const SEP=()=>L('────────────────────────────────','dim');

function clearAll(){
  localStorage.clear(); sessionStorage.clear();
  L('✅ localStorage + sessionStorage komplett gelöscht','ok');
  L('→ Lade Seite neu...','info');
  setTimeout(()=>location.reload(),1000);
}
function clearIntro(){
  localStorage.removeItem('mischa_intro_ts');
  sessionStorage.removeItem('mischa_intro_ts');
  L('✅ Intro-Timer gelöscht — Intro erscheint beim nächsten Öffnen','ok');
}
function showStorage(){
  SEP(); L('💾 KOMPLETTES STORAGE:','info');
  L('--- localStorage ('+localStorage.length+' Einträge):','info');
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    let v=localStorage.getItem(k);
    if(v&&v.length>200) v=v.substring(0,200)+'...';
    L('  '+k+' = '+v,'dim');
  }
  L('--- sessionStorage ('+sessionStorage.length+' Einträge):','info');
  for(let i=0;i<sessionStorage.length;i++){
    const k=sessionStorage.key(i);
    let v=sessionStorage.getItem(k);
    if(v&&v.length>200) v=v.substring(0,200)+'...';
    L('  '+k+' = '+v,'dim');
  }
}

async function forceLogin(){
  const name = prompt('Spielername eingeben:');
  if(!name) return;
  sessionStorage.setItem('mischa_current', name.toLowerCase());
  L('✅ Session gesetzt: mischa_current = '+name.toLowerCase(),'ok');
  L('→ Gehe zu index.html...','info');
  setTimeout(()=>location.href='index.html',800);
}

async function runDiag(){
  log.innerHTML='';
  L('=== DIAGNOSE GESTARTET ===','info');
  const urlP = new URLSearchParams(window.location.search).get('player');
  if(!urlP) L('💡 Tipp: Füge ?player=qqq zur URL hinzu um als eingeloggter Spieler zu testen','warn');
  L('Browser: '+navigator.userAgent,'dim');
  L('URL: '+location.href,'dim');
  SEP();

  // 1. localStorage
  L('📦 localStorage:','info');
  const introTs = localStorage.getItem('mischa_intro_ts');
  if(introTs){
    const age = Math.round((Date.now()-parseInt(introTs))/1000/60);
    L((age<10?'✅':'⚠️')+' intro_ts: '+age+' Min alt → Intro '+(age<10?'ÜBERSPRUNGEN':'würde erscheinen'), age<10?'ok':'warn');
  } else {
    L('⚠️ kein intro_ts → Intro erscheint beim nächsten Öffnen von index.html','warn');
  }
  // Show all localStorage keys
  for(let i=0;i<localStorage.length;i++){
    const k=localStorage.key(i);
    if(k!=='mischa_intro_ts'){
      let v=localStorage.getItem(k);
      if(v&&v.length>100)v=v.substring(0,100)+'...';
      L('  '+k+': '+v,'dim');
    }
  }
  SEP();

  // 2. sessionStorage
  L('🔐 sessionStorage:','info');
  const curUser = sessionStorage.getItem('mischa_current');
  const backupUser = localStorage.getItem('mischa_current_backup');
  const effectiveUser = curUser || backupUser;
  if(curUser){ L('✅ sessionStorage: Eingeloggt als: "'+curUser+'"','ok'); }
  else if(backupUser){ 
    L('⚠️ sessionStorage leer, aber localStorage backup: "'+backupUser+'" → wird wiederhergestellt','warn');
    // Auto-restore
    sessionStorage.setItem('mischa_current', backupUser);
    L('  → Session wurde wiederhergestellt!','ok');
  } else {
    L('❌ NICHT EINGELOGGT — weder sessionStorage noch localStorage backup!','err');
    L('  → Geh zu index.html und logge dich ein','warn');
  }
  for(let i=0;i<sessionStorage.length;i++){
    const k=sessionStorage.key(i);
    let v=sessionStorage.getItem(k);
    if(v&&v.length>100)v=v.substring(0,100)+'...';
    L('  '+k+': '+v,'dim');
  }
  SEP();

  // 3. Firebase
  L('🔥 Firebase:','info');
  // Try to init Firebase first
  try { initFirebase(); } catch(e) {}
  try {
    // Wait a moment for Firebase to connect
    await new Promise(r => setTimeout(r, 1000));
    const ok = typeof firebase !== 'undefined' && firebase.apps.length > 0;
    if(ok){ L('✅ Firebase SDK geladen und initialisiert','ok'); }
    else {
      L('❌ Firebase NICHT initialisiert!','err');
      L('  → Mögliche Ursachen: Kein Internet / GitHub Pages / Firewall','warn');
      L('  → Aber: localStorage-Fallback sollte trotzdem funktionieren','info');
    }
  } catch(e){ L('❌ Firebase Exception: '+e.message,'err'); }
  SEP();

  // 4. State methods
  L('⚙️ State-Methoden:','info');
  const methods=['getJokersRemaining','getCurrentPlayer','refreshCurrentPlayer','_getAllCalibration','_getCalibrationRuns','_local','getPlayer','savePlayer'];
  methods.forEach(m=>{
    const t = typeof State[m];
    L((t!=='undefined'?'✅':'❌')+' State.'+m+': '+t, t!=='undefined'?'ok':'err');
  });
  SEP();

  // 5. localStorage player data
  L('👤 Player im localStorage:','info');
  const localData = localStorage.getItem('mischa_players');
  if(localData){
    try{
      const players = JSON.parse(localData);
      const names = Object.keys(players);
      L('✅ '+names.length+' Spieler gespeichert: '+names.join(', '),'ok');
      names.forEach(n=>{
        const p=players[n];
        const worldsType = Array.isArray(p.worlds)?'ARRAY⚠️':typeof p.worlds;
        L('  '+n+': score='+p.totalScore+', worlds='+worldsType+
          (Array.isArray(p.worlds)?'['+p.worlds+']':'{'+Object.keys(p.worlds||{}).join(',')+'}'),'dim');
      });
    }catch(e){ L('❌ JSON Parse Error: '+e.message,'err'); }
  } else {
    L('⚠️ Keine Spieler im localStorage','warn');
  }
  SEP();

  // 6. Load current player
  L('🎮 Player laden:','info');
  // Try to restore from backup if not logged in
  if(!curUser){
    const backup = localStorage.getItem('mischa_current_backup');
    if(backup){
      sessionStorage.setItem('mischa_current', backup);
      L('🔄 Session aus Backup wiederhergestellt: "'+backup+'"','ok');
      curUser = backup;
    }
  }
  // Always try to load player - use effectiveUser (restored from backup)
  const effectiveUser2 = sessionStorage.getItem('mischa_current');
  if(!effectiveUser2){ 
    L('❌ Kein Benutzer — bitte einloggen','err');
  } else {
    L('🎮 Lade Player: "'+effectiveUser2+'"...','info');
  // Also show cal_data_v3 summary before loading player
  try {
    const calStore = JSON.parse(localStorage.getItem('cal_data_v3')||'{}');
    const keys = Object.keys(calStore);
    const devCounts = {};
    keys.forEach(k => { const dev=k.split('_').pop(); devCounts[dev]=(devCounts[dev]||0)+calStore[k].length; });
    L('📊 cal_data_v3: '+keys.length+' Spiel-Einträge | '+JSON.stringify(devCounts),'info');
  } catch(e) {}
    try{
      const start=Date.now();
      // Force State to use the current session
      State.currentPlayer = null; // reset cache
      const p = await Promise.race([
        State.getCurrentPlayer(),
        new Promise(r=>setTimeout(()=>r(null),4000))
      ]);
      const ms=Date.now()-start;
      if(p){
        L('✅ Player geladen in '+ms+'ms','ok');
        L('  name: "'+p.name+'"','ok');
        L('  totalScore: '+p.totalScore,'ok');
        const wt = Array.isArray(p.worlds)?'❌ ARRAY (BUG!)':'✅ object';
        L('  worlds: '+wt+(Array.isArray(p.worlds)?'':'  Keys: ['+Object.keys(p.worlds||{}).join(',')+']'),(Array.isArray(p.worlds)?'err':'ok'));
        L('  character: '+p.character,'ok');
        
        if(Array.isArray(p.worlds)){
          L('❌ worlds ist Array — das ist der Bug! "ALLES löschen" klicken','err');
        } else {
          // Test world 1 access
          const w1 = p.worlds['1'] || p.worlds[1];
          L(w1 ? '✅ Welt 1 Daten: '+w1.tasks?.filter(t=>t&&t.done).length+' Tasks erledigt' : '⚠️ Welt 1 noch nicht gespielt (leer = OK)','ok');
          
          // Test getJokersRemaining
          try{
            const j = State.getJokersRemaining(p,1);
            L('✅ getJokersRemaining(1): '+j,'ok');
          }catch(e){ L('❌ getJokersRemaining Error: '+e.message,'err'); }
          
          // Test WORLDS.find
          const world = window.WORLDS?.find(w=>w.id===1);
          L(world ? '✅ WORLDS.find(1): "'+world.name+'" ('+world.tasks?.length+' Tasks)' : '❌ WORLDS nicht geladen!','ok');
          
          SEP();
          L('✅✅✅ ALLES OK — Spiel sollte laden!','ok');
          L('→ Klicke "▶ Direkt zu Welt 1" um das Spiel zu starten','info');
        }
      } else {
        L('❌ Player NULL nach '+ms+'ms','err');
        L('  mischa_players hat "'+effectiveUser+'"? '+
          (JSON.parse(localStorage.getItem('mischa_players')||'{}')[effectiveUser2]?'JA':'NEIN'),'err');
        L('  → Mögliche Ursache: State._local nicht mit localStorage synchronisiert','warn');
        
        // Try direct localStorage access
        try{
          const raw = JSON.parse(localStorage.getItem('mischa_players')||'{}');
          const directP = raw[effectiveUser] || raw[effectiveUser.toLowerCase()];
          if(directP){
            L('✅ Direkt aus localStorage: Player gefunden!','ok');
            L('  name: '+directP.name+', score: '+directP.totalScore,'ok');
            L('  → State._local ist nicht initialisiert — das ist der Bug!','err');
            L('  → Fix: Klicke "🔧 State reparieren"','warn');
          }
        }catch(e){}
      }
    }catch(e){ L('❌ Exception: '+e.message+' @ '+e.stack?.split('\n')[1],'err'); }
  }
  SEP();

  // 7. WORLDS check
  L('🌍 WORLDS + GAME_LIST:','info');
  L((window.WORLDS?'✅':'❌')+' WORLDS: '+(window.WORLDS?.length||0)+' Welten', window.WORLDS?'ok':'err');
  if(window.WORLDS?.[0]){
    L('  Welt 1 tasks: '+window.WORLDS[0].tasks?.length,'dim');
    L('  Erste Task: '+JSON.stringify(window.WORLDS[0].tasks?.[0]),'dim');
  }
  L((window.GAME_LIST?'✅':'❌')+' GAME_LIST: '+(window.GAME_LIST?.length||0)+' Spiele', window.GAME_LIST?'ok':'err');
  SEP();

  L('=== DIAGNOSE FERTIG ===','info');
}

async function testWorld(){
  SEP(); L('🧪 WELT 1 SIMULATION:','info');
  const curUser = sessionStorage.getItem('mischa_current');
  if(!curUser){ L('❌ Nicht eingeloggt — zuerst einloggen!','err'); return; }
  try{
    L('1. refreshCurrentPlayer()...','info');
    const start=Date.now();
    const p = await Promise.race([State.refreshCurrentPlayer(), new Promise(r=>setTimeout(()=>r(null),5000))]);
    L((p?'✅':'❌')+' Player: '+(p?.name||'null')+' in '+(Date.now()-start)+'ms', p?'ok':'err');
    if(!p){L('→ STOPP: Kein Player','err');return;}

    L('2. worlds Format prüfen...','info');
    if(Array.isArray(p.worlds)){
      L('❌ worlds ist ARRAY — FIX wird angewendet...','err');
      p.worlds={};
    }
    if(!p.worlds) p.worlds={};
    L('✅ worlds OK: '+JSON.stringify(Object.keys(p.worlds)),'ok');

    L('3. WORLDS.find(id=1)...','info');
    const world = window.WORLDS?.find(w=>w.id===1);
    L((world?'✅':'❌')+' Welt 1: '+(world?.name||'NICHT GEFUNDEN'), world?'ok':'err');
    if(!world){L('→ STOPP: WORLDS nicht geladen','err');return;}

    L('4. ws (Spieler-Fortschritt)...','info');
    let ws = p.worlds[1] ?? p.worlds['1'];
    if(!ws) ws={tasks:Array(20).fill(null),jokerUsed:false,completed:false};
    L('✅ ws.tasks: '+ws.tasks?.length+' Einträge','ok');

    L('5. world.tasks.map() testen...','info');
    const done = ws.tasks.filter(t=>t&&t.done).length;
    L('✅ done: '+done+'/'+world.tasks.length,'ok');

    L('6. getJokersRemaining...','info');
    const rem = State.getJokersRemaining(p, 1);
    L('✅ Joker: '+rem,'ok');

    L('','');
    L('✅✅✅ ALLE CHECKS BESTANDEN — Welt 1 sollte laden!','ok');
    L('→ Falls es trotzdem hängt: Browser-Konsole (F12) öffnen und Fehler zeigen','warn');
  }catch(e){
    L('❌ FEHLER: '+e.message,'err');
    L('  Stack: '+e.stack?.split('\n').slice(0,3).join(' | '),'err');
  }
}

async function testLogin(){
  SEP(); L('🔑 TIEFER LOGIN-TEST:','info');
  const name = prompt('Nutzername:','qqq');
  const pw = prompt('Passwort:');
  if(!name||!pw) return;
  
  // Step 1: Check local storage
  const localP = State._local.get(name.toLowerCase());
  L('1. localStorage: '+(localP?'✅ Spieler gefunden: '+localP.name:'❌ NICHT vorhanden — nur Firebase möglich'),'info');
  if(localP){ L('   worlds: '+JSON.stringify(Object.keys(localP.worlds||{})),'dim'); }
  
  // Step 2: Check local password
  if(localP){
    const pwOk = localP.password === pw;
    L('2. Passwort lokal: '+(pwOk?'✅ korrekt':'❌ falsch'),'info');
    if(pwOk){
      L('   → Login würde sofort lokal funktionieren!','ok');
      sessionStorage.setItem('mischa_current', name.toLowerCase());
      localStorage.setItem('mischa_current_backup', name.toLowerCase());
      L('   → Session gesetzt!','ok');
    }
  }
  
  // Step 3: Try Firebase
  L('3. Firebase verfügbar: '+(State._useCloud&&State._useCloud()?'✅ JA':'❌ NEIN — Firebase nicht geladen'),'info');
  
  // Step 4: Full login
  L('4. State.login() aufrufen...','info');
  try{
    const start=Date.now();
    const res = await Promise.race([
      State.login(name, pw),
      new Promise(r=>setTimeout(()=>r({ok:false,error:'Timeout nach 5s'}),5000))
    ]);
    const ms=Date.now()-start;
    L((res?.ok?'✅':'❌')+' Login in '+ms+'ms: '+(res?.ok?res.player?.name:res?.error), res?.ok?'ok':'err');
    if(res?.ok){
      const wt = Array.isArray(res.player?.worlds)?'❌ ARRAY (BUG!)':'✅ object';
      L('  worlds type: '+wt, Array.isArray(res.player?.worlds)?'err':'ok');
      L('  worlds keys: '+JSON.stringify(Object.keys(res.player?.worlds||{})),'dim');
      // Auto set session
      sessionStorage.setItem('mischa_current', name.toLowerCase());
      localStorage.setItem('mischa_current_backup', name.toLowerCase());
      L('  → Session gesetzt! Du kannst jetzt zu index.html gehen.','ok');
    }
  }catch(e){L('❌ '+e.message,'err');}
}

function goToGame(){
  const u = sessionStorage.getItem('mischa_current') || localStorage.getItem('mischa_current_backup');
  if(!u){ alert('Nicht eingeloggt!'); return; }
  sessionStorage.setItem('mischa_current', u);
  localStorage.setItem('mischa_current_backup', u);
  localStorage.setItem('mischa_intro_ts', Date.now().toString());
  L('→ Gehe zu index.html als: '+u,'ok');
  setTimeout(()=>location.href='index.html?from_intro=1', 500);
}

function repairState(){
  L('🔧 Repariere State._local...','info');
  try{
    const raw = JSON.parse(localStorage.getItem('mischa_players')||'{}');
    const names = Object.keys(raw);
    L('  Gefunden: '+names.join(', '),'info');
    // Re-inject into State._local
    names.forEach(n=>{
      State._local.set(n, raw[n]);
      L('  ✅ '+n+' in State._local geladen','ok');
    });
    // Restore session
    const u = sessionStorage.getItem('mischa_current') || localStorage.getItem('mischa_current_backup');
    if(u && raw[u]){
      State.currentPlayer = raw[u];
      L('✅ currentPlayer gesetzt: '+u,'ok');
    }
    L('✅ State repariert — lade neu...','ok');
    setTimeout(()=>runDiag(), 500);
  }catch(e){ L('❌ Repair Fehler: '+e.message,'err'); }
}

// Auto-run on load
window.onload = async function(){ await runDiag(); };
</script>
</body>
</html>
